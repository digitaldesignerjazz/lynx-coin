[package]
name = "lynx-coin"
version = "0.2.0"
edition = "2021"
authors = ["Lynx-Coin Contributors"]
description = "Lynx-Coin blockchain core with genesis block and ed25519 transaction signatures - Rust implementation"
license = "MIT"
repository = "https://github.com/digitaldesignerjazz/lynx-coin"

[dependencies]
# Cryptographic hashing
sha2 = "0.10"

# Ed25519 signatures for transaction authorization
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

# Randomness for key generation
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }

# Time handling for block timestamps
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hex encoding for hashes and keys
hex = "0.4"

# CLI framework
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true