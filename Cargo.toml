[package]
name = "lynx-coin"
version = "0.1.0"
edition = "2021"
authors = ["Lynx-Coin Contributors"]
description = "Lynx-Coin blockchain core with genesis block - Rust implementation"
license = "MIT"
repository = "https://github.com/digitaldesignerjazz/lynx-coin"

[dependencies]
# Cryptographic hashing
sha2 = "0.10"

# Time handling for block timestamps
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hex encoding for hashes
hex = "0.4"

# CLI framework
clap = { version = "4.5", features = ["derive"] }

# Randomness (for future nonce strategies or keygen)
rand = "0.8"

[profile.release]
opt-level = 3
lto = true